[package]
name = "net_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.30"
tray-icon = "0.19"
sysinfo = { version = "0.32", default-features = false, features = ["network"] }
auto-launch = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
png = "0.17"
wry = "0.47"

[profile.release]
opt-level = "z"
lto = true
strip = true
